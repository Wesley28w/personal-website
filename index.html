<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <header class="section" id="intro">
      <div class="intro-row">
        <div class="intro-text">
          <h1 id="site-name"></h1>
          <p class="tagline" id="site-tagline"></p>
          <nav class="social-links" id="social-links"></nav>
        </div>
        <img src="" alt="" class="intro-photo" id="site-photo">
      </div>
    </header>

    <section class="section" id="about">
      <h2>About</h2>
      <p id="about-text"></p>
    </section>

    <ul class="highlights" id="highlights"></ul>

    <section class="section" id="experience">
      <h2>Experience</h2>
      <ul class="entry-list" id="experience-list"></ul>
    </section>

    <section class="section" id="projects">
      <h2>Projects</h2>
      <ul class="entry-list" id="projects-list"></ul>
    </section>

    <section class="section" id="writing">
      <h2>Writing</h2>
      <ul class="entry-list" id="writing-list"></ul>
    </section>

    <footer class="section" id="contact">
      <h2>Contact</h2>
      <p id="contact-info"></p>
    </footer>

  </div>
  <script src="js/site-data.js"></script>
  <script src="js/blog-data.js"></script>
  <script src="js/gallery-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
